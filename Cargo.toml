[package]
name = "classicube-livesplit-plugin"
version = "1.1.7"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { version = "=1.0.104", features = ["backtrace"] }
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
classicube-helpers = { git = "https://github.com/SpiralP/rust-classicube-helpers.git" }
classicube-sys = "=6.0.4"
futures-util = { version = "=0.3.34", default-features = false }
livesplit-core = { git = "https://github.com/LiveSplit/livesplit-core.git", tag = "v0.13.0" }
opener = { version = "=0.8.5", features = ["reveal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "=0.30.0"
tokio-util = { version = "=0.7.20", features = ["rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
